plugins {
    // ЗАМЕНЕНА: 3.4-SNAPSHOT -> 3.4.108
    id "architectury-plugin" version "3.4.108"
    // ЗАМЕНЕНА: 1.5-SNAPSHOT -> 1.6.14 (современная стабильная версия)
    id "dev.architectury.loom" version "1.6.14" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    // Добавляем репозиторий Architectury сюда, чтобы Loom мог найти все необходимое
    repositories {
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

        // Версия voicechat_api_version (2.3.3) у тебя уже стабильная, ее не трогаем
        implementation "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"
    }

    processResources {
        def expandProps = [
                "version": version,
                "group": project.group, //Else we target the task's group.
                "minecraft_version": minecraft_version,
                "min_minecraft_version": min_minecraft_version,
                "forge_version": forge_version,
                "forge_loader_version_range": forge_loader_version_range,
                "forge_version_range": forge_version_range,
                "minecraft_version_range": minecraft_version_range,
                "fabric_version": fabric_version,
                "fabric_loader_version": fabric_loader_version,
                "voicechat_api_version": voicechat_api_version,
                "architectury_version": architectury_version,
                "mod_name": mod_name,
                "mod_author": mod_author,
                "mod_id": mod_id,
                "license": license,
                "description": project.description,
                "credits": credits
        ]

        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.version
    group = rootProject.group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.

        maven { url = 'https://maven.maxhenkel.de/repository/public' }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }

    tasks.register('publish01Fabric', GradleBuild) {
        group = 'walkie-talkie'
        tasks = [
                ':common:clean',
                ':fabric:clean',
                ':fabric:curseforge',
                ':fabric:modrinth'
        ]
    }

    tasks.register('publish02Forge', GradleBuild) {
        group = 'walkie-talkie'
        tasks = [
                ':common:clean',
                ':forge:clean',
                ':forge:curseforge',
                ':forge:modrinth'
        ]
    }

}
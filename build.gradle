// УБИРАЕМ СТАРЫЙ БЛОК plugins {} И ЗАМЕНЯЕМ ЕГО НА buildscript {}
// Этот блок выполняется самым первым и говорит Gradle, где искать плагины для сборки.
buildscript {
    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // Указываем стабильные версии плагинов
        classpath 'dev.architectury:architectury-plugin:3.4.108'
        classpath 'dev.architectury.loom:dev.architectury.loom.gradle.plugin:1.6.14'
    }
}

// ПРИМЕНЯЕМ ПЛАГИН СТАРЫМ СПОСОБОМ
apply plugin: 'architectury-plugin'

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    // Применяем loom здесь, как и было
    apply plugin: "dev.architectury.loom"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

        implementation "de.maxhenkel.voicechat:voicechat-api:${root.voicechat_api_version}"
    }

    processResources {
        def expandProps = [
                "version": version,
                "group": project.group,
                "minecraft_version": minecraft_version,
                "min_minecraft_version": min_minecraft_version,
                "forge_version": forge_version,
                "forge_loader_version_range": forge_loader_version_range,
                "forge_version_range": forge_version_range,
                "minecraft_version_range": minecraft_version_range,
                "fabric_version": fabric_version,
                "fabric_loader_version": fabric_loader_version,
                "voicechat_api_version": voicechat_api_version,
                "architectury_version": architectury_version,
                "mod_name": mod_name,
                "mod_author": mod_author,
                "mod_id": mod_id,
                "license": license,
                "description": project.description,
                "credits": credits
        ]

        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.version
    group = rootProject.group

    repositories {
        // Репозитории для зависимостей мода (не плагинов)
        maven { url = 'https://maven.maxhenkel.de/repository/public' }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }

    tasks.register('publish01Fabric', GradleBuild) {
        group = 'walkie-talkie'
        tasks = [
                ':common:clean',
                ':fabric:clean',
                ':fabric:curseforge',
                ':fabric:modrinth'
        ]
    }

    tasks.register('publish02Forge', GradleBuild) {
        group = 'walkie-talkie'
        tasks = [
                ':common:clean',
                ':forge:clean',
                ':forge:curseforge',
                ':forge:modrinth'
        ]
    }
}
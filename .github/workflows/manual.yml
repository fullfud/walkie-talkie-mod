name: Build for 1.20.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # ШАГ 1: ИСПОЛЬЗУЕМ ОФИЦИАЛЬНОЕ ДЕЙСТВИЕ ДЛЯ GRADLE
      # Это действие автоматически кэширует не только зависимости, но и сам Gradle (wrapper),
      # а также настраивает кэш сборки (Build Cache).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Включаем кэширование и зависимостей, и метаданных Gradle
          cache-read-only: false 
          
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ШАГ 2: СОБИРАЕМ ПРОЕКТ С ФЛАГАМИ ОПТИМИЗАЦИИ
      - name: Build Release JARs
        run: ./gradlew remapJar --build-cache --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walkietalkie-1.20.1-build-${{ github.run_number }}
          path: |
            */build/libs/*.jar
            !*/build/libs/*-dev-shadow.jar
            !*/build/libs/*-sources.jar
